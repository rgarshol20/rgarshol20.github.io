<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Rory Garshol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c10;
      --bg2: #0d1117;
      --accent: #00e5ff;
      --accent2: #ff6b35;
      --text: #e8edf2;
      --muted: #5a6a7a;
      --border: #1a2535;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
    .error-code {
      font-family: 'Syne', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px rgba(0, 229, 255, 0.2);
      position: absolute;
      user-select: none;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
    }
    .eyebrow::before { content: '// '; opacity: 0.5; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
    }
    p {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.7;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background: var(--accent);
      color: #000;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      margin-top: 0.5rem;
      transition: all 0.2s;
    }
    a:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 229, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <div class="content">
    <p class="eyebrow">Page Not Found</p>
    <h1>Nothing here.</h1>
    <p>This page doesn't exist or may have moved. Head back to the homepage and find what you're looking for.</p>
    <a href="/index.html">← Back to Home</a>
  </div>
</body>
</html>
